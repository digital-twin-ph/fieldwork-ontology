name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The vocabulary lives in another repository, so rebuild on a schedule to pick up changes
  # there. A stale render is worse than a missing one: it looks current.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the vocabulary from Fieldwork
        uses: actions/checkout@v4
        with:
          repository: digital-twin-ph/fieldwork
          path: .fieldwork
      - name: Record which commit this site renders
        run: echo "Fieldwork commit $(git -C .fieldwork rev-parse HEAD)"
      - run: ./scripts/sync-ontology.sh .fieldwork
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # --strict turns a failed competency question into a failed build: the gate this site keeps.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
